name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build of main as a release with this tag (e.g. v0.1.0); empty: just build"
        required: false
        default: ""

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # only used to publish a release (v* tag, or started by hand with a release tag)
    steps:
      - name: Check the release request
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "releases are made from main, not ${{ github.ref }}" }
          if ($env:RELEASE -notmatch '^v\d+\.\d+\.\d+$') { throw "the release tag must look like v1.2.3, not '$env:RELEASE'" }

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Tests
        run: python -m pytest

      - name: Regional extracts on the real Geofabrik server (informational)
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
        run: python tools/check_extracts.py

      - name: Qt window smoke test (off-screen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/qt_smoke.py

      - name: Build (PyInstaller, one folder)
        run: pyinstaller packaging/OfflineRailwayMap.spec --noconfirm

      - name: The build starts and writes nothing
        shell: pwsh
        run: |
          # SPEC 11: nothing in the program folder (not even __pycache__) until
          # there is something to keep, and never anything under %APPDATA%,
          # %LOCALAPPDATA% or in the registry (HKCU\Software).
          # Other software on the runner sometimes writes there meanwhile:
          # Firefox's background tasks create AppData\...\Mozilla.  Such names
          # only warn - unless the program itself started that software, which
          # the list of processes started meanwhile (with their parents) shows.
          $notOurs = @("Mozilla")
          $program = "dist/OfflineRailwayMap"
          $listProgram = { Get-ChildItem -Recurse -Force -LiteralPath $program | ForEach-Object FullName }
          $watched = @($env:APPDATA, $env:LOCALAPPDATA)
          $list = { $watched | ForEach-Object { Get-ChildItem -Force -LiteralPath $_ | ForEach-Object FullName } }
          $listRegistry = { Get-ChildItem -Path "HKCU:\Software" | ForEach-Object Name }
          $listTemp = { Get-ChildItem -Force -LiteralPath $env:TEMP | ForEach-Object FullName }
          $beforeProgram = & $listProgram
          $before = & $list
          $beforeRegistry = & $listRegistry
          $beforeTemp = & $listTemp
          $env:QT_QPA_PLATFORM = "offscreen"
          $started = Get-Date
          $p = Start-Process -FilePath "$program/OfflineRailwayMap.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the program exited early (code $($p.ExitCode))" }
          # Processes started while the program ran, and which of them it started itself
          $since = @(Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $started })
          $ours = @($p.Id)
          do {
            $more = @($since | Where-Object { ($ours -contains $_.ParentProcessId) -and ($ours -notcontains $_.ProcessId) } | ForEach-Object ProcessId)
            $ours += $more
          } while ($more.Count)
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3
          $newProgram = Compare-Object @($beforeProgram) @(& $listProgram) | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject
          if ($newProgram) { throw "created in the program folder: $($newProgram -join ', ')" }
          $new = @(Compare-Object @($before) @(& $list) | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject)
          $others = @($new | Where-Object { $notOurs -contains (Split-Path $_ -Leaf) })
          $new = @($new | Where-Object { $notOurs -notcontains (Split-Path $_ -Leaf) })
          if ($others.Count) {
            Write-Warning "created by other software on the runner: $($others -join ', ')"
            $since | Format-Table ProcessId, ParentProcessId, Name, CreationDate -AutoSize | Out-String -Width 200 | Write-Host
            $spawned = @($since | Where-Object { ($ours -contains $_.ProcessId) -and ($_.ProcessId -ne $p.Id) -and ($_.Name -notmatch '^QtWebEngineProcess') })
            if ($spawned.Count) { throw "the program started other programs: $(($spawned | ForEach-Object Name) -join ', ')" }
          }
          if ($new.Count) { throw "created outside the program folder: $($new -join ', ')" }
          $newRegistry = Compare-Object @($beforeRegistry) @(& $listRegistry) | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject
          if ($newRegistry) { throw "created in the registry: $($newRegistry -join ', ')" }
          $newTemp = Compare-Object @($beforeTemp) @(& $listTemp) | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject
          if ($newTemp) { Write-Warning "new in %TEMP% while the program ran (may be other processes): $($newTemp -join ', ')" }

      - name: The build can filter regional extracts (osmium self-check)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-check.txt"
          $p = Start-Process -FilePath "dist/OfflineRailwayMap/OfflineRailwayMap.exe" -ArgumentList "--self-check", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "self-check failed (exit code $($p.ExitCode))" }

      - name: Package
        id: package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE: ${{ inputs.release }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import offline_railway_map as m; print(m.__version__)"
          $tag = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { $env:RELEASE }
          if ($tag -and $tag -ne "v$version") { throw "tag $tag does not match the program version $version" }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md -Destination dist/OfflineRailwayMap
          Copy-Item licenses -Destination dist/OfflineRailwayMap/licenses -Recurse
          $zip = "OfflineRailwayMap-$version-win64.zip"
          Compress-Archive -Path dist/OfflineRailwayMap -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: OfflineRailwayMap-win64
          path: ${{ steps.package.outputs.zip }}

      # On a pushed v* tag, or when started by hand on main with a release tag
      # (the tag is then created on this commit).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OfflineRailwayMap ${{ inputs.release || github.ref_name }}
